
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Araffi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header id="header-biodata">
        <h2 class="judul">Biodata Saya</h2>
        <nav>
            <a href="index.html" class="link-menu">Beranda</a>
            <a href="biodata.html" class="link-menu">Biodata</a>
        </nav>
    </header>

    <!-- Formulir Biodata -->
    <main id="konten-biodata">
        <h2 class="subjudul">Formulir Biodata</h2>

        <form id="form-biodata" class="form-container">

            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama"
                   class="input-form"
                   placeholder="Masukkan nama lengkap" required>

            <label for="nim">NIM</label>
            <input type="text" id="nim" name="nim"
                   class="input-form"
                   placeholder="Masukkan NIM" required>

            <label for="jurusan">Jurusan</label>
            <select id="jurusan" name="jurusan"
                    class="input-form" required>
                <option value="">Pilih jurusan</option>
                <option value="Informatika">Informatika</option>
                <option value="Sistem Informasi">Sistem Informasi</option>
                <option value="Manajemen">Manajemen</option>
                <option value="Akuntansi">Akuntansi</option>
                <option value="Lainnya">Lainnya</option>
            </select>

            <!-- Alamat menggantikan Email -->
            <label for="alamat">Alamat</label>
            <textarea id="alamat" name="alamat"
                      class="input-form" rows="3"
                      placeholder="Masukkan alamat lengkap"
                      required></textarea>

            <label for="jenis-kelamin">Jenis Kelamin</label>
            <select id="jenis-kelamin" name="jenis-kelamin"
                    class="input-form" required>
                <option value="">Pilih jenis kelamin</option>
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
            </select>

            <button type="submit" id="tombol-simpan">
                Simpan Biodata
            </button>

        </form>
    </main>

    <!-- Footer -->
    <footer id="footer-biodata">
        <p class="teks-footer">Website Araffi © 2026</p>
    </footer>

    <!-- Notifikasi -->
    <script>
        document.getElementById("form-biodata")
            .addEventListener("submit", function(event) {
                event.preventDefault();
                alert("Biodata berhasil diisi!");
            });
    </script>

</body>
</html>
